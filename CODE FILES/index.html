    function HolographicCanvas({ theme }) {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const mouseRef = useRef({ x: 160, y: 120, active: false });
      const animationFrameRef = useRef(null);
      const angleRef = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = canvas.width;
        let height = canvas.height;

        const drawGrid = (ctx, w, h) => {
          ctx.strokeStyle = theme === 'light' ? 'rgba(67, 91, 65, 0.08)' : 'rgba(130, 158, 128, 0.08)';
          ctx.lineWidth = 1;
          for (let i = 20; i < w; i += 20) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, h);
            ctx.stroke();
          }
          for (let j = 20; j < h; j += 20) {
            ctx.beginPath();
            ctx.moveTo(0, j);
            ctx.lineTo(w, j);
            ctx.stroke();
          }
        };

        const drawHand = (ctx, x, y, isStatic) => {
          const strokeColor = theme === 'light' ? '#8c7d6c' : '#eedcc4';
          const jointColor = theme === 'light' ? '#bd5d38' : '#db8c69';

          ctx.strokeStyle = strokeColor;
          ctx.fillStyle = jointColor;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([2, 3]);

          // Wrist point
          ctx.beginPath();
          ctx.arc(x, y + 60, 5, 0, 2 * Math.PI);
          ctx.fill();

          // Palm base to knuckle connections
          ctx.beginPath();
          ctx.moveTo(x, y + 60);
          ctx.lineTo(x - 30, y + 15);
          ctx.lineTo(x - 10, y - 5);
          ctx.lineTo(x + 20, y);
          ctx.lineTo(x + 40, y + 25);
          ctx.closePath();
          ctx.stroke();

          const t = angleRef.current;
          const wave = isStatic ? Math.sin(t * 2) * 5 : 0;

          const joints = [
            [-35, 10, -55, -5 + wave],  // thumb
            [-20, -5, -25, -45 + wave],  // index
            [0, -10, 0, -55 + wave],    // middle
            [20, -5, 25, -45 + wave],   // ring
            [35, 15, 45, -15 + wave]    // pinky
          ];

          joints.forEach(j => {
            ctx.beginPath();
            ctx.moveTo(x, y + 20);
            ctx.lineTo(x + j[0], y + j[1]);
            ctx.lineTo(x + j[2], y + j[3]);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x + j[0], y + j[1], 4.5, 0, 2 * Math.PI);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x + j[2], y + j[3], 4.5, 0, 2 * Math.PI);
            ctx.fill();
          });

          ctx.strokeStyle = strokeColor;
          ctx.beginPath();
          ctx.arc(x, y + 60, 15 + Math.sin(t * 3) * 3, 0, 2 * Math.PI);
          ctx.stroke();

          ctx.setLineDash([]);
        };

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          drawGrid(ctx, width, height);
          angleRef.current += 0.03;

          let targetX = mouseRef.current.x;
          let targetY = mouseRef.current.y;

          if (!mouseRef.current.active) {
            targetX = width / 2 + Math.cos(angleRef.current) * 30;
            targetY = height / 2 - 20 + Math.sin(angleRef.current) * 15;
          }

          drawHand(ctx, targetX, targetY, !mouseRef.current.active);

          ctx.fillStyle = theme === 'light' ? 'rgba(30, 27, 24, 0.6)' : 'rgba(245, 239, 230, 0.6)';
          ctx.font = '9px "JetBrains Mono", monospace';
          ctx.fillText(`MODE: ${mouseRef.current.active ? 'ACTIVE_TRACK' : 'ORBIT_SIM'}`, 12, 20);
          ctx.fillText(`VECTOR_X: ${Math.round(targetX)}`, 12, 32);
          ctx.fillText(`VECTOR_Y: ${Math.round(targetY)}`, 12, 44);
          ctx.fillText(`SYS_HZ: 60`, 12, 56);

          ctx.strokeStyle = theme === 'light' ? '#eadecf' : '#3a332d';
          ctx.beginPath();
          ctx.rect(5, 5, width - 10, height - 10);
          ctx.stroke();

          const bracketLen = 10;
          ctx.strokeStyle = theme === 'light' ? '#435b41' : '#eadecf';
          ctx.lineWidth = 1.5;
          const corners = [
            [5, 5, 1, 1],
            [width - 5, 5, -1, 1],
            [5, height - 5, 1, -1],
            [width - 5, height - 5, -1, -1]
          ];
          corners.forEach(([cx, cy, dx, dy]) => {
            ctx.beginPath();
            ctx.moveTo(cx, cy + dy * bracketLen);
            ctx.lineTo(cx, cy);
            ctx.lineTo(cx + dx * bracketLen, cy);
            ctx.stroke();
          });

          animationFrameRef.current = requestAnimationFrame(render);
        };

        render();

        return () => {
          if (animationFrameRef.current) {
            cancelAnimationFrame(animationFrameRef.current);
          }
        };
      }, [theme]);

      const handleMouseMove = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        mouseRef.current = {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          active: true
        };
      };

      const handleMouseLeave = () => {
        mouseRef.current.active = false;
      };

      return (
        <div
          ref={containerRef}
          className={`w-full md:w-80 h-64 border-2 rounded-xl relative overflow-hidden flex items-center justify-center cursor-crosshair transition-all duration-300 shadow-lg hover:shadow-2xl animate-fade-in ${theme === 'light'
              ? 'bg-card-bg border-card-border'
              : 'bg-rich border-pale/20'
            }`}
          onMouseMove={handleMouseMove}

          <span className={`absolute bottom-2 right-2 text-[9px] font-mono tracking-wider pointer-events-none select-none transition-colors duration-300 ${theme === 'light' ? 'text-rich opacity-60' : 'text-[#ebebdf] opacity-60'
            }`}>INTERACTIVE HOLOGRAPHIC SKELETON</span>
        </div>
      );
    }

        // Generate PIP, DIP, and TIP joints
        let cx = base.x;
        let cy = base.y;
        let cz = 0;

        for (let jIdx = 0; jIdx < 3; jIdx++) {
          const len = segments[jIdx];
          const dx = Math.sin(angle) * len * extension;
          const dy = Math.cos(angle) * len * extension;
          const dz = -len * (1.0 - extension) * 0.8;

          cx += dx;
          cy += dy;
          cz += dz;

          points.push({ x: cx, y: cy, z: cz });
        }
      }
      return points;
    };

    // --- PROCEDURAL 3D Volumetric Hand Renderer ---
    const drawVolumetricHand = (ctx, joints, width, height, theme, count) => {
      ctx.clearRect(0, 0, width, height);

      // Draw high-fidelity grid background
      ctx.strokeStyle = theme === 'light' ? 'rgba(67, 91, 65, 0.05)' : 'rgba(130, 158, 128, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 20;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      if (!joints || joints.length < 21) return;

      const scale = Math.min(width, height) * 0.95;
      const cx = width / 2;
      const cy = height / 2 + 60;

      // Project 3D points to 2D screen space
      const pts = joints.map(pt => {
        // Perspective divide simulation using Z depth
        const perspective = 1 / (1 + pt.z * 0.5);
        return {
          x: cx + pt.x * scale * perspective,
          y: cy - pt.y * scale * perspective,
          r: 6 * perspective
        };
      });

      // Ambient drop-shadow settings for organic hand depth
      ctx.save();
      ctx.shadowColor = theme === 'light' ? 'rgba(30, 27, 24, 0.12)' : 'rgba(0, 0, 0, 0.5)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 6;

      // 1. Draw the Fleshy Palm Body
      ctx.beginPath();
      const wrist = pts[0];
      const bases = [pts[1], pts[5], pts[9], pts[13], pts[17]]; // MCP Joints (bases of fingers)
      
      ctx.moveTo(wrist.x, wrist.y);
      
      // Left side curve of the palm (thenar eminence / thumb muscle)
      ctx.quadraticCurveTo(wrist.x - 32, (wrist.y + bases[0].y) / 2, bases[0].x, bases[0].y);
      
      // Connect bases across top of palm
      ctx.lineTo(bases[1].x, bases[1].y);
      ctx.lineTo(bases[2].x, bases[2].y);
      ctx.lineTo(bases[3].x, bases[3].y);
      ctx.lineTo(bases[4].x, bases[4].y);
      
      // Right side curve of the palm (hypothenar eminence)
      ctx.quadraticCurveTo(bases[4].x + 28, (bases[4].y + wrist.y) / 2, wrist.x, wrist.y);
      ctx.closePath();

      const palmGrad = ctx.createRadialGradient(
        wrist.x, wrist.y, 10,
        wrist.x, wrist.y - 30, scale * 0.35
      );

      if (theme === 'light') {
        palmGrad.addColorStop(0, '#c3aa93'); // rich muscle depth
        palmGrad.addColorStop(0.5, '#eedcc4'); // healthy base skin
        palmGrad.addColorStop(1, '#faf6f0'); // bright knuckle highlights
      } else {
        palmGrad.addColorStop(0, '#1c1815');
        palmGrad.addColorStop(0.5, 'rgba(130, 158, 128, 0.45)');
        palmGrad.addColorStop(1, 'rgba(219, 140, 105, 0.2)');
      }
      ctx.fillStyle = palmGrad;
      ctx.fill();

      // Soft outline for palm
      ctx.strokeStyle = theme === 'light' ? 'rgba(30, 27, 24, 0.12)' : 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 2. Draw Fleshy Tapering Fingers (capsule envelope around skeleton joints)
      const fingerJointChains = [
        [1, 2, 3, 4],     // Thumb
        [5, 6, 7, 8],     // Index
        [9, 10, 11, 12],  // Middle
        [13, 14, 15, 16], // Ring
        [17, 18, 19, 20]  // Pinky
      ];

      fingerJointChains.forEach((chainIdxs, fIdx) => {
        const chain = chainIdxs.map(idx => pts[idx]);
        
        ctx.beginPath();
        const baseWidth = chain[0].r * 2.6; // thick base
        const tipWidth = chain[3].r * 1.8;   // tapered tip
        
        // Trace up the left side of the finger segments
        for (let i = 0; i < 3; i++) {
          const p1 = chain[i];
          const p2 = chain[i+1];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const len = Math.sqrt(dx*dx + dy*dy);
          const nx = -dy / len;
          const ny = dx / len;
          
          const w = baseWidth - (i * (baseWidth - tipWidth) / 3);
          
          if (i === 0) {
            ctx.moveTo(p1.x + nx * w, p1.y + ny * w);
          }
          ctx.lineTo(p2.x + nx * (w * 0.9), p2.y + ny * (w * 0.9));
        }

        // Cap the tip with a rounded arc
        const tip = chain[3];
        const nextToTip = chain[2];
        const tipAngle = Math.atan2(tip.y - nextToTip.y, tip.x - nextToTip.x);
        ctx.arc(tip.x, tip.y, tipWidth, tipAngle - Math.PI/2, tipAngle + Math.PI/2);

        // Trace back down the right side of the segments
        for (let i = 2; i >= 0; i--) {
          const p1 = chain[i];
          const p2 = chain[i+1];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const len = Math.sqrt(dx*dx + dy*dy);
          const nx = -dy / len;
          const ny = dx / len;
          
          const w = baseWidth - (i * (baseWidth - tipWidth) / 3);
          ctx.lineTo(p1.x - nx * w, p1.y - ny * w);
        }
        ctx.closePath();

        // 3D cylinder lighting gradient along the length of each finger
        const grad = ctx.createLinearGradient(chain[0].x, chain[0].y, tip.x, tip.y);
        if (theme === 'light') {
          grad.addColorStop(0, '#dcbfa3'); // warm tendon base
          grad.addColorStop(0.6, '#eedcc4'); // smooth hand skin
          grad.addColorStop(1, '#fbf8f3'); // bright tip light glint
        } else {
          grad.addColorStop(0, '#24201c');
          grad.addColorStop(0.6, 'rgba(130, 158, 128, 0.45)');
          grad.addColorStop(1, 'rgba(219, 140, 105, 0.25)');
        }
        
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = theme === 'light' ? 'rgba(30, 27, 24, 0.12)' : 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 3. Draw subtle joint fold creases (PIP and DIP folds)
        ctx.save();
        ctx.shadowColor = 'transparent'; // disable shadow for fold lines
        for (let i = 1; i <= 2; i++) {
          const joint = chain[i];
          const prev = chain[i-1];
          const next = chain[i+1];
          // calculate line perpendicular to segment direction
          const dx = next.x - prev.x;
          const dy = next.y - prev.y;
          const len = Math.sqrt(dx*dx + dy*dy);
          const nx = -dy / len;
          const ny = dx / len;
          const w = baseWidth - (i * (baseWidth - tipWidth) / 3);

          ctx.beginPath();
          ctx.moveTo(joint.x - nx * (w * 0.7), joint.y - ny * (w * 0.7));
          ctx.lineTo(joint.x + nx * (w * 0.7), joint.y + ny * (w * 0.7));
          ctx.strokeStyle = theme === 'light' ? 'rgba(30, 27, 24, 0.2)' : 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.restore();
      });

      ctx.restore(); // remove main ambient shadow filter for details

      // 4. Draw elegant glossy radial knuckle caps (PIP joints)
      fingerJointChains.forEach((chainIdxs, fIdx) => {
        // Draw at knuckle joints for high-end look
        const pip = pts[chainIdxs[1]];
        ctx.beginPath();
        ctx.arc(pip.x, pip.y, pip.r * 1.1, 0, 2 * Math.PI);

        const radial = ctx.createRadialGradient(
          pip.x - pip.r * 0.2, pip.y - pip.r * 0.2, pip.r * 0.1,
          pip.x, pip.y, pip.r * 1.1
        );

        if (theme === 'light') {
          radial.addColorStop(0, '#ffffff');
          radial.addColorStop(0.3, '#f7c3aa');
          radial.addColorStop(0.8, '#bd5d38');
          radial.addColorStop(1, '#8c3d18');
        } else {
          radial.addColorStop(0, '#ffffff');
          radial.addColorStop(0.3, '#f7c3aa');
          radial.addColorStop(0.8, '#db8c69');
          radial.addColorStop(1, '#944422');
        }
        ctx.fillStyle = radial;
        ctx.fill();
      });
    };

    function App() {

      const lastSysStatusRef = useRef('SYSTEM IDLE');

      // Global keyboard shortcut listeners
      useEffect(() => {

      }, []);

      // Fetch backend health & dynamic class vocabulary from unified model
      useEffect(() => {

        fetch('/api/v1/classes')

          .catch(err => console.error("Error loading model vocabulary:", err));
      }, []);

      // STT Speech recognition controller hooks (Uno Reverse)
      const recognitionRef = useRef(null);

      const startListening = () => {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
          alert("Web Speech Recognition API is not supported in this browser. Please use Google Chrome.");
          return;
        }
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRec();
        rec.continuous = false;
        rec.interimResults = false;
        rec.lang = inputLang === 'en' ? 'en-US' : 'hi-IN';

        rec.onstart = () => {
          setIsListening(true);
        };

        rec.onresult = (event) => {
          const resultText = event.results[event.results.length - 1][0].transcript.trim();
          setTtsInputText(prev => prev ? prev + " " + resultText : resultText);
          
          // Trigger dynamic morphed vector sign animation spelling sequentially
          triggerDynamicSpeechPlayback(resultText);
        };

        rec.onerror = (e) => {
          console.error("Speech Recognition error:", e);
          setIsListening(false);
        };

        rec.onend = () => {
          setIsListening(false);
        };

        rec.start();
        recognitionRef.current = rec;
      };

      const stopListening = () => {
        if (recognitionRef.current) {
          recognitionRef.current.stop();
        }
        setIsListening(false);
      };

      const triggerDynamicSpeechPlayback = async (spokenText) => {
        setIsPlayingSequence(true);
        setActiveTokenIdx(-1);
        setUnmappedTokens([]);
        try {
          const res = await fetch('/api/v1/text-to-sign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: spokenText, language: inputLang })
          });
          const data = await res.json();
          if (!res.ok) return;

          const tokens = data.tokens || [];
          const seqMap = {};
          (data.sequence || []).forEach(item => {
            if (item && item.token && item.animation_id) {
              seqMap[item.token.toLowerCase()] = item.animation_id;
            }
          });
          setPlayingTokens(tokens);
          setUnmappedTokens(data.fallback_tokens || []);

          for (let i = 0; i < tokens.length; i++) {
            setActiveTokenIdx(i);
            const rawToken = tokens[i];
            const token = rawToken.toLowerCase();
            const gestureKey = seqMap[token] || (inputLang === 'en' ? ENGLISH_ANIM_MAP[token] : HINDI_ANIM_MAP[rawToken]);
            if (gestureKey && HAND_MAPPINGS[gestureKey]) {
              setCurrentGestureKey(gestureKey);
              setCurrentPose(gestureKey);
              await new Promise(r => setTimeout(r, 500));
            } else {
              setCurrentGestureKey(null);
              const chars = rawToken.split('');
              for (let char of chars) {
                if (char.trim()) {
                  setCurrentPose(char.toLowerCase());
                  await new Promise(r => setTimeout(r, 240));
                }
              }
            }
          }
          setActiveTokenIdx(-1);
          setCurrentGestureKey(null);
          setCurrentPose('palm');
          setIsPlayingSequence(false);
        } catch (err) {
          console.error("Speech playback failed:", err);
          setIsPlayingSequence(false);
        }
      };

      // Volumetric 3D Neumorphic Hand Canvas morph tweening loop
      const currentJointsRef = useRef([]);
      const targetJointsRef = useRef([]);
      const velocityRef = useRef(Array(21).fill(null).map(() => ({ x: 0, y: 0 })));

      useEffect(() => {
        if (activeTab !== 'text-to-sign') return;
        const canvas = document.getElementById('virtual-sign-avatar-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let count = 0;

        if (currentJointsRef.current.length === 0) {
          currentJointsRef.current = getPoseCoordinates('palm', 0);
        }

        const render = () => {
          count++;
          targetJointsRef.current = getPoseCoordinates(currentPose, count);

          // Damped Spring Physics tween calculations
          const k = 0.30; // spring force constant
          const d = 0.52; // dampening factor
          const dt = 1.0;

          for (let i = 0; i < 21; i++) {
            const curr = currentJointsRef.current[i];
            const target = targetJointsRef.current[i];
            const vel = velocityRef.current[i];

            if (!curr || !target || !vel) continue;

            const forceX = -k * (curr.x - target.x) - d * vel.x;
            const forceY = -k * (curr.y - target.y) - d * vel.y;

            vel.x += forceX * dt;
            vel.y += forceY * dt;

            curr.x += vel.x * dt;
            curr.y += vel.y * dt;
          }

          drawVolumetricHand(ctx, currentJointsRef.current, canvas.width, canvas.height, theme, count);
          animId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animId);
      }, [activeTab, currentPose, theme]);

      // Slide Walkthrough Animation Loop
      useEffect(() => {
        if (activeTab !== 'discover') return;
        const canvas = document.getElementById('slide-animation-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let count = 0;

        const render = () => {
          count++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const colorMain = theme === 'light' ? '#435b41' : '#f5efe6';
          const colorSub = theme === 'light' ? '#8c7d6c' : '#eedcc4';
          const colorPulse = theme === 'light' ? '#bd5d38' : '#db8c69';

          ctx.strokeStyle = colorMain;
          ctx.fillStyle = colorMain;

          if (activeSlideIdx === 0) {
            // Neural Inference - animated skeleton hand + coordinates
            // Draw a subtle moving mesh grid in the background
            ctx.strokeStyle = theme === 'light' ? 'rgba(67, 91, 65, 0.08)' : 'rgba(130, 158, 128, 0.08)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += 40) {
              ctx.beginPath();
              ctx.moveTo(i, 0);
              ctx.lineTo(i, canvas.height);
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(0, i);
              ctx.lineTo(canvas.width, i);
              ctx.stroke();
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 30;
            const t = count * 0.03;

            // Draw a hand skeleton that waves gently
            ctx.strokeStyle = colorSub;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([2, 3]);

            // Wrist joint
            const wrist = { x: centerX, y: centerY + 60 };
            const palm = { x: centerX, y: centerY };
            const thumb = { x: centerX - 50 + Math.sin(t) * 5, y: centerY + 10 + Math.cos(t) * 3 };
            const index = { x: centerX - 30 + Math.sin(t + 0.5) * 4, y: centerY - 60 + Math.cos(t + 0.5) * 5 };
            const middle = { x: centerX + Math.sin(t + 1) * 3, y: centerY - 75 + Math.cos(t + 1) * 6 };
            const ring = { x: centerX + 30 + Math.sin(t + 1.5) * 4, y: centerY - 60 + Math.cos(t + 1.5) * 5 };
            const pinky = { x: centerX + 55 + Math.sin(t + 2) * 5, y: centerY - 30 + Math.cos(t + 2) * 4 };

            // Draw links
            ctx.beginPath();
            ctx.moveTo(wrist.x, wrist.y);
            ctx.lineTo(palm.x, palm.y);
            ctx.stroke();

            // Connect fingers
            const fingers = [thumb, index, middle, ring, pinky];
            fingers.forEach(f => {
              ctx.beginPath();
              ctx.moveTo(palm.x, palm.y);
              ctx.lineTo(f.x, f.y);
              ctx.stroke();
            });

            ctx.setLineDash([]); // Reset line dash

            // Draw joint nodes
            fingers.forEach(f => {
              ctx.beginPath();
              ctx.arc(f.x, f.y, 4.5, 0, 2 * Math.PI);
              ctx.fillStyle = colorPulse;
              ctx.fill();

              // Node telemetry label
              ctx.font = '8px "JetBrains Mono", monospace';
              ctx.fillStyle = colorMain;
              ctx.fillText(`X:${Math.round(f.x)} Y:${Math.round(f.y)}`, f.x + 8, f.y + 3);
            });

            ctx.beginPath();
            ctx.arc(wrist.x, wrist.y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = colorPulse;
            ctx.fill();

            // Draw scanning bounding box
            ctx.strokeStyle = colorPulse;
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(centerX - 90, centerY - 110, 180, 210);
            ctx.setLineDash([]);

            ctx.fillStyle = colorMain;
            ctx.font = '9px "JetBrains Mono", monospace';
            ctx.fillText("FRAME_RATE: 30.1 FPS", centerX - 80, centerY - 95);
            ctx.fillText("INFERENCE_ENGINE: OK", centerX - 80, centerY - 85);

          } else if (activeSlideIdx === 1) {
            // Flask Random Forest Classifier split nodes animation
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 20;
            const t = count * 0.02;

            // Draw decision tree nodes
            const root = { x: centerX, y: centerY - 60 };
            const child1 = { x: centerX - 80, y: centerY + 10 };
            const child2 = { x: centerX + 80, y: centerY + 10 };
            const leaf1 = { x: centerX - 120, y: centerY + 80 };
            const leaf2 = { x: centerX - 40, y: centerY + 80 };
            const leaf3 = { x: centerX + 40, y: centerY + 80 };
            const leaf4 = { x: centerX + 120, y: centerY + 80 };

            // Lines and flow dots
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = colorSub;

            const drawBranch = (n1, n2) => {
              ctx.beginPath();
              ctx.moveTo(n1.x, n1.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.stroke();

              // Moving dot
              const progress = (t % 1);
              const dotX = n1.x + (n2.x - n1.x) * progress;
              const dotY = n1.y + (n2.y - n1.y) * progress;
              ctx.beginPath();
              ctx.arc(dotX, dotY, 4, 0, 2 * Math.PI);
              ctx.fillStyle = colorPulse;
              ctx.fill();
            };

            drawBranch(root, child1);
            drawBranch(root, child2);
            drawBranch(child1, leaf1);
            drawBranch(child1, leaf2);
            drawBranch(child2, leaf3);
            drawBranch(child2, leaf4);

            // Draw node boxes
            const drawNode = (node, text) => {
              ctx.fillStyle = theme === 'light' ? '#faf6f0' : '#24201c';
              ctx.fillRect(node.x - 25, node.y - 12, 50, 24);
              ctx.strokeStyle = theme === 'light' ? '#eadecf' : '#3a332d';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(node.x - 25, node.y - 12, 50, 24);

              ctx.fillStyle = theme === 'light' ? '#1e1b18' : '#f5efe6';
              ctx.font = '8px "Plus Jakarta Sans", sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(text, node.x, node.y + 4);
            };

            drawNode(root, "Root Input");
            drawNode(child1, "Split A");
            drawNode(child2, "Split B");
            drawNode(leaf1, "C: 98%");
            drawNode(leaf2, "C: 94%");
            drawNode(leaf3, "C: 91%");
            drawNode(leaf4, "C: 96%");
            ctx.textAlign = 'left';

            ctx.font = '9px "JetBrains Mono", monospace';
            ctx.fillStyle = colorPulse;
            ctx.fillText("CLASSIFYING... FOREST_TREE_RUN: [TRUE]", centerX - 100, centerY + 130);

          } else if (activeSlideIdx === 2) {
            // Audio-Synthesis Bridge - bouncing waveform graph
            const startY = canvas.height / 2;
            ctx.strokeStyle = colorMain;
            ctx.lineWidth = 2.5;
            ctx.beginPath();

            // Draw waveform lines
            for (let x = 30; x < canvas.width - 30; x++) {
              const amp = 30 + Math.sin(count * 0.05) * 15;
              const y = startY + Math.sin(x * 0.04 + count * 0.12) * Math.sin(x * 0.007) * amp;
              if (x === 30) {
                ctx.moveTo(x, y);
              } else {
                ctx.lineTo(x, y);
              }
            }
            ctx.stroke();

            // Draw coordinate grid bars
            ctx.lineWidth = 1;
            ctx.strokeStyle = colorPulse;
            for (let x = 50; x < canvas.width; x += 60) {
              ctx.beginPath();
              ctx.moveTo(x, startY - 70);
              ctx.lineTo(x, startY + 70);
              ctx.stroke();
            }

            // Label text speech synth active
            ctx.font = '9px "JetBrains Mono", monospace';
            ctx.fillStyle = colorMain;
            ctx.fillText("SPEECH_SYNTHESIZER: ACTIVE", 40, startY - 90);
            ctx.fillText("SMOOTHING_BUFFER: PASS [X]", 40, startY - 75);
            ctx.fillText("UTTERANCE_RATE: 1.0x", 40, startY + 95);

          } else if (activeSlideIdx === 3) {
            // Bilingual Sign Generation - outline tracer Devanagari character
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 20;

            // Draw outline for Letter N "न"
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = colorSub;

            ctx.beginPath();
            // Shirorekha (Top bar)
            ctx.moveTo(centerX - 60, centerY - 50);
            ctx.lineTo(centerX + 60, centerY - 50);
            // Stand bar (Vertical bar)
            ctx.moveTo(centerX + 30, centerY - 50);
            ctx.lineTo(centerX + 30, centerY + 60);
            // Middle horizontal connecting line
            ctx.moveTo(centerX - 30, centerY + 10);
            ctx.lineTo(centerX + 30, centerY + 10);
            // Triangle/loop
            ctx.moveTo(centerX - 30, centerY + 10);
            ctx.quadraticCurveTo(centerX - 55, centerY + 10, centerX - 55, centerY + 30);
            ctx.quadraticCurveTo(centerX - 55, centerY + 50, centerX - 30, centerY + 50);
            ctx.quadraticCurveTo(centerX - 30, centerY + 10, centerX - 30, centerY + 10);
            ctx.stroke();

            // Tracing dot along Devanagari shape
            const t = (count * 0.015) % 4;
            let tracerX = centerX;
            let tracerY = centerY;

            if (t < 1) {
              // top bar
              tracerX = (centerX - 60) + 120 * t;
              tracerY = centerY - 50;
            } else if (t < 2) {
              // stand bar
              const progress = t - 1;
              tracerX = centerX + 30;
              tracerY = (centerY - 50) + 110 * progress;
            } else if (t < 3) {
              // middle horizontal connector
              const progress = t - 2;
              tracerX = (centerX + 30) - 60 * progress;
              tracerY = centerY + 10;
            } else {
              // loop
              const progress = t - 3;
              const angle = progress * 2 * Math.PI;
              tracerX = centerX - 42.5 + Math.cos(angle) * 12.5;
              tracerY = centerY + 30 + Math.sin(angle) * 20;
            }

            // Draw glowing tracker node
            ctx.beginPath();
            ctx.arc(tracerX, tracerY, 8, 0, 2 * Math.PI);
            ctx.fillStyle = colorPulse;
            ctx.fill();

            // Draw glowing tracker node center
            ctx.beginPath();
            ctx.arc(tracerX, tracerY, 3, 0, 2 * Math.PI);
            ctx.fillStyle = colorMain;
            ctx.fill();

            ctx.font = '9px "JetBrains Mono", monospace';
            ctx.fillStyle = colorMain;
            ctx.fillText("DEVANAGARI_OUTLINE_INTERPOLATOR: READY", 40, centerY - 75);
            ctx.fillText(`VECTOR_COORDINATE: [${Math.round(tracerX)}, ${Math.round(tracerY)}]`, 40, centerY + 90);
          }

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animId);
        };
      }, [activeTab, activeSlideIdx, theme]);

      const initMediaPipe = () => {
        if (handsRef.current) return;

        const handsInstance = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        handsInstance.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.65,
          minTrackingConfidence: 0.65
        });

        handsInstance.onResults(onHandsResults);
        handsRef.current = handsInstance;
      };

      const onHandsResults = (results) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        latestLmsRef.current = [];

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          if (lastSysStatusRef.current !== 'INFERENCE RUNNING') {
            lastSysStatusRef.current = 'INFERENCE RUNNING';
            setSysStatus('INFERENCE RUNNING');
            if (speechEnabled) speakAloudText("Hand detected. Starting live translation.");
          }

          results.multiHandLandmarks.forEach((lm) => {
            const flattened = lm.flatMap(pt => [pt.x, pt.y, pt.z]);
            latestLmsRef.current.push(flattened);

            if (landmarksVisible) {
              // High fidelity geometric hand skeleton line drawings in active visual colors
              ctx.strokeStyle = theme === 'light' ? '#eedcc4' : '#3a332d';
              ctx.fillStyle = theme === 'light' ? '#bd5d38' : '#db8c69';
              ctx.lineWidth = 1.5;
              ctx.setLineDash([2, 3]);

              // Draw palm base lines
              ctx.beginPath();
              ctx.moveTo(lm[0].x * canvas.width, lm[0].y * canvas.height);
              for (let i = 1; i <= 4; i++) {
                ctx.lineTo(lm[i].x * canvas.width, lm[i].y * canvas.height);
              }
              ctx.lineTo(lm[0].x * canvas.width, lm[0].y * canvas.height);
              ctx.stroke();

              // Draw fingers skeleton
              const fingers = [
                [5, 6, 7, 8],     // index
                [9, 10, 11, 12],  // middle
                [13, 14, 15, 16], // ring
                [17, 18, 19, 20], // pinky
                [1, 2, 3, 4]      // thumb
              ];

              fingers.forEach(chain => {
                ctx.beginPath();
                ctx.moveTo(lm[0].x * canvas.width, lm[0].y * canvas.height);
                ctx.lineTo(lm[chain[0]].x * canvas.width, lm[chain[0]].y * canvas.height);
                for (let i = 0; i < chain.length - 1; i++) {
                  ctx.lineTo(lm[chain[i]].x * canvas.width, lm[chain[i]].y * canvas.height);
                  ctx.lineTo(lm[chain[i + 1]].x * canvas.width, lm[chain[i + 1]].y * canvas.height);
                }
                ctx.stroke();
              });

              ctx.setLineDash([]);

              // Draw joint nodes
              lm.forEach((pt) => {
                ctx.beginPath();
                ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 4.5, 0, 2 * Math.PI);
                ctx.fill();
              });
            }
          });
        } else {
          if (lastSysStatusRef.current !== 'NO HAND DETECTED' && camActive) {
            lastSysStatusRef.current = 'NO HAND DETECTED';
            setSysStatus('NO HAND DETECTED');
            setPrediction('No Hand Detected');
            setConfidence(null);
            setSecondPrediction('No Hand Detected');
            setSecondConfidence(null);
            if (speechEnabled) speakAloudText("No hand detected.");
          } else if (!camActive) {
            setSysStatus('SYSTEM IDLE');
            setPrediction('No Hand Detected');
            setConfidence(null);
          }
        }
      };

      const queryInferenceBackend = async () => {
        try {
          const lms = latestLmsRef.current;
          if (!lms || lms.length === 0) {
            setPrediction('No Hand Detected');
            setConfidence(null);
            setSecondPrediction('No Hand Detected');
            setSecondConfidence(null);
            return;
          }

          // Hand 1 (First Hand)
          if (lms[0] && lms[0].length === 63) {
            try {
              const response = await fetch('/api/v1/infer/landmarks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ landmarks: lms[0], session_id: 'signbridge-portal-session-h1' })
              });

              if (response.ok) {
                const data = await response.json();
                const pred = data.smoothed_prediction || data.prediction || '-';
                const conf = data.confidence || 0.0;

                setPrediction(pred);
                setConfidence(conf);
                setSmoothedPrediction(pred);

                // Simulation buffer visualizer
                setSmoothingBuffer(prev => {
                  const next = [...prev, pred];
                  if (next.length > 6) next.shift();
                  return next;
                });

                if (data.commit && pred !== "No Hand Detected") {
                  if (lastCommitWordRef.current !== pred) {
                    lastCommitWordRef.current = pred;
                    const normalizedWord = pred.toUpperCase();
                    setTranscript(prev => {
                      const updated = [...prev, normalizedWord];
                      if (speechEnabled) speakAloudText(normalizedWord);
                      return updated;
                    });
                  }
                }
              }
            } catch (e) {
              console.error("Hand 1 inference error:", e);
            }
          } else {
            setPrediction('No Hand Detected');
            setConfidence(null);
          }

          // Hand 2 (Second Hand)
          if (lms[1] && lms[1].length === 63) {
            try {
              const response = await fetch('/api/v1/infer/landmarks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ landmarks: lms[1], session_id: 'signbridge-portal-session-h2' })
              });

              if (response.ok) {
                const data = await response.json();
                const pred = data.smoothed_prediction || data.prediction || '-';
                const conf = data.confidence || 0.0;

                setSecondPrediction(pred);
                setSecondConfidence(conf);
                setSecondSmoothedPrediction(pred);

                if (data.commit && pred !== "No Hand Detected") {
                  if (lastCommitWordRef2.current !== pred) {
                    lastCommitWordRef2.current = pred;
                    const normalizedWord = pred.toUpperCase();
                    setTranscript(prev => {
                      const updated = [...prev, normalizedWord];
                      if (speechEnabled) speakAloudText(normalizedWord);
                      return updated;
                    });
                  }
                }
              }
            } catch (e) {
              console.error("Hand 2 inference error:", e);
            }
          } else {
            setSecondPrediction('No Hand Detected');
            setSecondConfidence(null);
          }
        } catch (e) {
          console.error("Failed contacting Flask endpoint:", e);
        }
      };

      const speakAloudText = (text) => {
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.95;
          utterance.pitch = 1.0;
          window.speechSynthesis.speak(utterance);
        }
      };

      const toggleCamera = async () => {
        if (camActive) {
          // Terminate
          if (loopTimerRef.current) clearInterval(loopTimerRef.current);
          if (cameraRef.current) {
            cameraRef.current.stop();
            cameraRef.current = null;
          }
          const stream = videoRef.current?.srcObject;
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
          if (videoRef.current) videoRef.current.srcObject = null;
          setCamActive(false);
          lastSysStatusRef.current = 'SYSTEM IDLE';
          setSysStatus('SYSTEM IDLE');
          if (speechEnabled) speakAloudText("Webcam camera deactivated.");
        } else {
          // Activate
          try {
            setCamError(null);
            lastSysStatusRef.current = 'CAMERA ACTIVE';
            setSysStatus('CAMERA ACTIVE');
            if (speechEnabled) speakAloudText("Webcam camera activated. Please align your hand inside the frame.");
            initMediaPipe();

            const stream = await navigator.mediaDevices.getUserMedia({
              video: { width: 640, height: 480, facingMode: 'user' },
              audio: false
            });

            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play();
            }

            const cam = new Camera(videoRef.current, {
              onFrame: async () => {
                if (videoRef.current) {
                  await handsRef.current.send({ image: videoRef.current });
                }
              },
              width: 640,
              height: 480
            });
            cam.start();
            cameraRef.current = cam;

            setCamActive(true);
            // Capture frame and predict every 90ms for instantaneous translations
            loopTimerRef.current = setInterval(queryInferenceBackend, 90);
          } catch (err) {
            console.error("Camera access failed:", err);
            setCamError("Webcam permissions were denied or camera is currently unavailable.");
            setSysStatus('SYSTEM IDLE');
          }
        }
      };

      useEffect(() => {
        return () => {
          if (loopTimerRef.current) clearInterval(loopTimerRef.current);
        };
      }, []);

      // --- TEXT-TO-SIGN ANIMATION PLAYBACK ---
      const triggerTextToSign = async () => {
        if (!ttsInputText.trim()) return;
        setIsPlayingSequence(true);
        setActiveTokenIdx(-1);
        setUnmappedTokens([]);

        try {
          const res = await fetch('/api/v1/text-to-sign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: ttsInputText, language: inputLang })
          });
          const data = await res.json();

          if (!res.ok) {
            console.error("Mapping failed");
            setIsPlayingSequence(false);
            return;
          }

          const tokens = data.tokens || [];
          const seqMap = {};
          (data.sequence || []).forEach(item => {
            if (item && item.token && item.animation_id) {
              seqMap[item.token.toLowerCase()] = item.animation_id;
            }
          });
          setPlayingTokens(tokens);
          setUnmappedTokens(data.fallback_tokens || []);

          if (tokens.length === 0) {
            setIsPlayingSequence(false);
            return;
          }

          // Sequence Player loop
          for (let i = 0; i < tokens.length; i++) {
            setActiveTokenIdx(i);
            const rawToken = tokens[i];
            const token = rawToken.toLowerCase();

            // Resolve hand gesture illustration key
            const gestureKey = seqMap[token] || (inputLang === 'en' ? ENGLISH_ANIM_MAP[token] : HINDI_ANIM_MAP[rawToken]);
            if (gestureKey && HAND_MAPPINGS[gestureKey]) {
              setCurrentGestureKey(gestureKey);
              setCurrentPose(gestureKey);
              await new Promise(resolve => setTimeout(resolve, 500));
            } else {
              // Dynamic Fingerspelling fallback for unmapped words!
              setCurrentGestureKey(null);
              const chars = rawToken.split('');
              for (let char of chars) {
                if (char.trim()) {
                  setCurrentPose(char.toLowerCase());
                  await new Promise(resolve => setTimeout(resolve, 240));
                }
              }
            }
          }

          setActiveTokenIdx(-1);
          setCurrentGestureKey(null);
          setCurrentPose('palm');
          setIsPlayingSequence(false);
        } catch (e) {
          console.error("Text to sign playback failed:", e);
          setIsPlayingSequence(false);
        }
      };

      // --- HISTORIC LOG ACTIONS ---
      const saveTranscriptSession = () => {
        if (transcript.length === 0) return;
        const phrase = transcript.join(' ');
        const now = new Date();
        const timestamp = now.toISOString().replace('T', ' ').slice(0, 19);
        const acc = confidence ? Number((confidence * 100).toFixed(1)) : 92.5;
        const newEntry = {
          id: Date.now(),
          phrase,
          timestamp,
          language: "English",
          accuracy: acc
        };
        setSavedConversations(prev => [newEntry, ...prev]);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(phrase).catch(() => {});
        }
      };

      const filteredLogs = useMemo(() => {
        return savedConversations.filter(log =>
          log.phrase.toLowerCase().includes(searchQuery.toLowerCase()) ||
          log.language.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }, [savedConversations, searchQuery]);

      const deleteLog = (id) => {
        setSavedConversations(prev => prev.filter(c => c.id !== id));
      };

      // Styles bindings based on Font Scale state
      const textClass = fontScale === 'large' ? 'text-lg' : fontScale === 'xlarge' ? 'text-xl' : 'text-sm';
      const headingClass = fontScale === 'large' ? 'text-3xl' : fontScale === 'xlarge' ? 'text-4xl' : 'text-2xl';

      return (
        <div className={`min-h-screen flex flex-col transition-colors duration-300 relative overflow-hidden bg-transparent ${theme === 'light' ? 'text-rich' : 'text-pale'} ${highContrast ? 'contrast-border' : ''}`}>

          {/* Ambient Glowing Orbs */}
          <div className="absolute top-[-100px] left-[-100px] bg-glowing-orb-1"></div>
          <div className="absolute bottom-[-100px] right-[-100px] bg-glowing-orb-2"></div>

          {/* Ambient Blueprint Grid Layer */}
          <div className="absolute inset-0 ambient-grid pointer-events-none opacity-[0.25]"></div>

          {/* --- TOP HEADER & NAVIGATION --- */}
          <header className={`transition-colors duration-300 ${theme === 'light' ? 'bg-card-bg/70' : 'bg-rich/70'} sticky top-0 backdrop-blur z-40`}>
            <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

              <div className="flex items-center cursor-pointer" onClick={() => setActiveTab('discover')}>
                <SignBridgeLogo size="sm" />
              </div>

              {/* Navigation Tabs */}
              <nav className="hidden md:flex items-center space-x-1">
                {[
                  { id: 'discover', label: 'Discover' },
                  { id: 'translator', label: 'Live Translator' },
                  { id: 'text-to-sign', label: 'Text-to-Sign' },
                  { id: 'dashboard', label: 'Insights & Log' },
                  { id: 'about', label: 'Academic Scope' }
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-4 py-2 text-sm font-semibold rounded-lg btn-hover-scale ${activeTab === tab.id
                        ? (theme === 'light' ? 'bg-rich text-pale' : 'bg-pale text-rich')
                        : 'opacity-70 hover:opacity-100'
                      }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>

              {/* Header Actions */}
              <div className="flex items-center space-x-3">

                {/* Accessibility display settings button */}
                <button
                  title="Accessibility Control Suite"
                  onClick={() => setShowShortcutsOverlay(true)}
                  className={`p-2 rounded-lg border transition-colors btn-hover-scale ${theme === 'light' ? 'border-rich hover:bg-rich hover:text-pale' : 'border-pale hover:bg-pale hover:text-rich'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 8v8M8 12h8" />
                  </svg>
                </button>

                {/* --- PURE TWO-COLOR LIGHT/DARK DUAL TOGGLE --- */}
                <button
                  title={`Toggle ${theme === 'light' ? 'Dark' : 'Light'} Mode`}
                  onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}
                  className={`p-2 rounded-lg border transition-all duration-300 btn-hover-scale ${theme === 'light'
                      ? 'border-rich bg-pale text-rich hover:bg-rich hover:text-pale'
                      : 'border-pale bg-rich text-pale hover:bg-pale hover:text-rich'
                    }`}
                >
                  {theme === 'light' ? (
                    // Inverted Moon icon
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                  ) : (
                    // Inverted Sun icon
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="5" />
                      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" strokeLinecap="round" />
                    </svg>
                  )}
                </button>

                {/* Live Engine Status Badge */}
                <div
                  onClick={() => setActiveTab('dashboard')}
                  title="View Engine Diagnostics & Saved Logs"
                  className={`hidden sm:inline-flex items-center space-x-2 px-3 py-1.5 text-xs font-bold border rounded-lg cursor-pointer btn-hover-scale ${theme === 'light' ? 'border-rich bg-pale text-rich' : 'border-pale bg-rich text-pale'}`}
                >
                  <span className={`w-2 h-2 rounded-full ${engineInfo.engine === 'initializing' ? 'bg-yellow-500' : 'bg-green-500'}`}></span>
                  <span className="uppercase">{engineInfo.engine === 'lstm' ? 'BiLSTM Active' : (engineInfo.engine === 'random_forest' ? 'RF-300 Active' : 'Geometric Engine')}</span>
                </div>

              </div>
            </div>
          </header>

          {/* --- MOBILE SUB MENU TABS --- */}
          <div className={`md:hidden flex justify-around p-2 ${theme === 'light' ? 'bg-card-bg' : 'bg-rich'}`}>
            {[
              { id: 'discover', label: 'Discover' },
              { id: 'translator', label: 'Translator' },
              { id: 'text-to-sign', label: 'Text-to-Sign' },
              { id: 'dashboard', label: 'Dashboard' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`text-xs font-bold px-2 py-1 rounded ${activeTab === tab.id ? (theme === 'light' ? 'bg-rich text-pale' : 'bg-pale text-rich') : 'opacity-70'}`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* --- MAIN PAGE VIEW CONTENT ROUTER --- */}
          <main className="flex-grow max-w-7xl w-full mx-auto px-6 py-8">

            {/* =========================================================================
                1) LANDING / DISCOVER PAGE
                ========================================================================= */}
            {activeTab === 'discover' && (

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">

                  {/* Left Column: Toggles */}
                  <div className="space-y-4">
                    <h4 className="text-xs font-bold uppercase tracking-wider border-b pb-1">Layout Parameters</h4>

                    {/* Contrast toggle */}
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-semibold">Contrast Enhanced Borders</span>
                      <button
                        onClick={() => setHighContrast(v => !v)}
                        className={`px-3 py-1 border text-[10px] font-bold rounded ${highContrast ? 'bg-green-700 text-white border-green-900' : 'opacity-65'}`}
                      >
                        {highContrast ? "ACTIVE" : "INACTIVE"}
                      </button>
                    </div>

                    {/* Font scale select */}
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-semibold">Text Scale Factors</span>
                      <div className="flex space-x-1">
                        {['normal', 'large', 'xlarge'].map((sz) => (
                          <button
                            key={sz}
                            onClick={() => setFontScale(sz)}
                            className={`px-2 py-0.5 text-[9px] font-bold border rounded uppercase ${fontScale === sz ? 'bg-current text-white font-black' : 'opacity-60'
                              }`}
                          >
                            {sz}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Right Column: Shortcuts */}
                  <div className="space-y-4">
                    <h4 className="text-xs font-bold uppercase tracking-wider border-b pb-1">System Keyboard Indexes</h4>

                    <div className="space-y-2 text-[11px] font-medium leading-relaxed opacity-95">
                      <div className="flex justify-between">
                        <span>Toggle Theme Profile:</span>
                        <kbd className="px-1.5 py-0.5 border rounded font-mono text-[9px]">Alt + T</kbd>
                      </div>
                      <div className="flex justify-between">
                        <span>Accessibility Panel:</span>
                        <kbd className="px-1.5 py-0.5 border rounded font-mono text-[9px]">Alt + A</kbd>
                      </div>
                      <div className="flex justify-between">
                        <span>Terminate Dialogs:</span>
                        <kbd className="px-1.5 py-0.5 border rounded font-mono text-[9px]">Escape</kbd>
                      </div>
                    </div>
                  </div>

                </div>

                <div className="text-center pt-2 border-t text-[10px] opacity-75">
                  Designed in compliance with <strong>WCAG 2.2 AA</strong> accessibility indices.
                </div>

              </div>

            </div>
          )}

          {/* --- FOOTER MAIN --- */}
          <footer className={`border-t py-8 mt-12 transition-colors duration-300 ${theme === 'light' ? 'border-rich' : 'border-pale'}`}>
            <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs opacity-75">

              <div>
                <span className="font-bold font-brand tracking-tight">SignBridge</span> - A micro project by Siddhesh Tiwari Muhammed Habeeb Tanishq Mehtab and varun yadav
              </div>

              <div className="flex space-x-4">
                <span className="cursor-pointer hover:underline" onClick={() => setActiveTab('about')}>Research Citation</span>
                <span className="cursor-pointer hover:underline" onClick={() => setActiveTab('translator')}>Translation Gateway</span>
                <span className="cursor-pointer hover:underline" onClick={() => setActiveTab('text-to-sign')}>Playback Engine</span>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>

</body>

</html>
